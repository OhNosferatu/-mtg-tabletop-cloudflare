name = "mtg-tabletop-cloudflarefinal"
main = "worker-h123.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H123: keep H122's interactive Full Board piles and exact one-to-one geometry.
# Battlefield cards now show a yellow selection outline while held/moved. On
# Full Board, selecting a card temporarily freezes board scrolling and blocks
# other board interactions so only the selected card can move against a fixed
# coordinate frame. The same yellow drag-selection treatment is used on Your
# Side for consistency.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
