name = "mtg-tabletop-cloudflarefinal"
main = "worker-h227.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H227 keeps H226/H225/H223 gameplay and geometry intact. It fixes a CSS
# visibility conflict during Your Side -> Full Board: H222 was explicitly making
# the Full Board viewport visible while H226 was trying to keep its parent hidden
# during staging. H227 gives the staged hidden state higher specificity so Safari
# cannot paint the opponent/top frame before the player anchor is ready.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
