name = "mtg-tabletop-cloudflarefinal"
main = "worker-h254.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H254 repairs a generated deckVisibleFaceUp misspelling that could abort render
# after import or pile/deck actions, leaving missing/stale piles and frozen input.
# It also removes phantom card-back artwork from truly empty decks and applies
# the same 60% physical overlap snap rule to dedicated Opponent piles. H253 Full
# Board live-state/deck fixes and H247 free-placement behavior remain intact.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
