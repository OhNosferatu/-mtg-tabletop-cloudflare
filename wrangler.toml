name = "mtg-tabletop-cloudflarefinal"
main = "worker-h202.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H202 keeps H201 as the stable baseline and mirrors the player-side parity fix
# for the opponent: dedicated Opponent pile slots now map exactly into the upper
# Full Board half, and opponent pile labels use the same neutral-gray typography
# on both screens. No card, land-zone, scroll, board-size, or gesture behavior changes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
