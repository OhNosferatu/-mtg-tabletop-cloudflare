name = "mtg-tabletop-cloudflarefinal"
main = "worker-h138.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H138: preserve H137 player/opponent accent system, but restore the Your Side
# land zone to its original green treatment. All geometry and interactions stay
# unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
