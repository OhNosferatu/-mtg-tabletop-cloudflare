name = "mtg-tabletop-cloudflarefinal"
main = "worker-h50.js"
compatibility_date = "2026-08-31"

# H50: move deck fullscreen controls off the legacy inspect stack, serialize
# deck actions, and allow repeated Scry 1 presses to build a private scry hand.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
