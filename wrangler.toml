name = "mtg-tabletop-cloudflarefinal"
main = "worker-h78.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H78: recovery build on the known-good H71/H70 interaction stack. Keep full
# token discovery, but disable stationary Tokens-pile taps while preserving
# drag-to-Hand and drag-to-battlefield behavior.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
