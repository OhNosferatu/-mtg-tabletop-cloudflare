name = "mtg-tabletop-cloudflarefinal"
main = "worker-h145.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H145: preserve H144 turn-button colors and H142 lighter-gray battlefield while
# removing the Full Board Draw/Mulligan/Untap collapsible dropdown. The same
# three controls now remain fixed and visible on Full Board just like Your Side.
# No gameplay, board geometry, dragging, snapping, or gesture behavior changes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
