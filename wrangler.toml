name = "mtg-tabletop-cloudflarefinal"
main = "worker-h92.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H92: preserve H91 battlefield gestures, H90 Hand counter, and H89 Mulligan.
# Reorganize the full-card controls into fixed rows, keep X/X labeled as X/X,
# and add a split reset control for X/X values and +/-1 counters.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
