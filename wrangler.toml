name = "mtg-tabletop-cloudflarefinal"
main = "worker-h155.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H155: bypass the H152-H154 runtime-built Opponent UI and render the mirrored
# Opponent board structure directly into the HTML so iOS Safari cannot miss it.
# Opponent tab mirrors Your Side with Tokens -> Graveyard -> Deck -> Exile ->
# Commander, top land zone, bottom life, and count-only hand. Full Board/player
# behavior remains unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
