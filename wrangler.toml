name = "mtg-tabletop-cloudflarefinal"
main = "worker-h91.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H91: preserve H90 Hand counter and stable H89 Mulligan, but invert battlefield
# card gestures: single tap opens full-screen view after a short double-tap
# window; double tap toggles tapped/untapped state; drag behavior is unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
