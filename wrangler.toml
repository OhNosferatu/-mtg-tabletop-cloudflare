name = "mtg-tabletop-cloudflarefinal"
main = "worker-h166.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H166: preserve H165 mana-token sizing/artwork. The mana token editor now uses
# the device's native numeric keyboard for Set Value and adopts the same
# translucent full-screen backdrop style used by the card inspector.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
