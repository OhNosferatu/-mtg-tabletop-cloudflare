name = "mtg-tabletop-cloudflarefinal"
main = "worker-h132.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H132: preserve H131/H130/H129/H128/H127/H126 behavior. Keep the exact H119
# Full Board geometry, match Your Side/Opponent card-face rendering to Full Board,
# and force the same counter-pill typography/geometry across every battlefield.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
