name = "mtg-tabletop-cloudflarefinal"
main = "worker-h126.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H126: preserve H125 combined counter display, but restore the H124 battlefield
# gesture bridge that H125 accidentally renamed in HTML. Single tap opens the
# card viewer, double tap rotates, and long-press drag commits the new position
# instead of snapping back.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
