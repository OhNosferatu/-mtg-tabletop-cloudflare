name = "mtg-tabletop-cloudflarefinal"
main = "worker-h83.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H83: preserve H82 token preload/count behavior and add a full-screen visual
# indicator beside tapped cards showing the clockwise sideways tap direction.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
