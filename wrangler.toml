name = "mtg-tabletop-cloudflarefinal"
main = "worker-h51.js"
compatibility_date = "2026-08-31"

# H51: keep the lightweight H50 deck overlay while making deck opening
# single/double-tap safe and non-blocking on iPhone Safari.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
