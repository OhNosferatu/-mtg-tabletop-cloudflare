name = "mtg-tabletop-cloudflarefinal"
main = "worker-h193.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H193: keep the H178 three-screen layout and remove only the legacy Full Board
# pseudo-boundary rules that appear as a full-width green horizontal line.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
