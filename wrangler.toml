name = "mtg-tabletop-cloudflarefinal"
main = "worker-h179.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H179: experimental full-board-only interface. Hide Your Side/Opponent view
# controls and dedicated screens, initialize the established Full Board once,
# then keep Full Board as the only battlefield view.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
