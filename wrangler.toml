name = "mtg-tabletop-cloudflarefinal"
main = "worker-h157.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H157: bypass H152-H156 opponent-screen markup attempts. Render the dedicated
# Opponent mirror as an independent overlay inside #board when the Opponent tab
# is active. This avoids any legacy #opp DOM replacement/clearing behavior while
# preserving Full Board, Your Side, token spawning, graveyard terminology, and
# current hand/turn fixes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
