name = "mtg-tabletop-cloudflarefinal"
main = "worker-h159.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H159: preserve H158 opponent overlay/hand behavior. Align the Opponent label
# and the single opponent life heart to the same centerline as the mirrored pile
# column, with vertical spacing so they no longer overlap.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
