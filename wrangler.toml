name = "mtg-tabletop-cloudflarefinal"
main = "worker-h203.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H203 keeps H202 as the stable baseline and shifts only opponent pile vertical
# anchoring. The dedicated Opponent Commander is mirrored 13.5% from its bottom
# edge to match the player's 13.5% top offset, with the remaining opponent piles
# preserving the same spacing on both Opponent and Full Board views.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
