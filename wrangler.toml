name = "mtg-tabletop-cloudflarefinal"
main = "worker-h252.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H252 keeps H251's confirmed Full Board pile geometry and H247 free card
# placement. Full Board is now rebuilt from the same live canonical card/pile
# arrays after every render, so deck counts/top cards and viewer-driven zone moves
# cannot leave stale mirror state. H124 remains the sole battlefield recognizer;
# its Full Board drop path is wrapped only to apply the same 80% pile-overlap snap.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
