name = "mtg-tabletop-cloudflarefinal"
main = "worker-h242.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H242 keeps H240/H241 one-to-one card sizing and board geometry, but tightens
# the shared battlefield corner radius from 7px to 4px. Your Side, Opponent, and
# Full Board still use one identical outer clipping rule; only the amount of the
# rounded cut is reduced so the printed black card border is not over-rounded.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
