name = "mtg-tabletop-cloudflarefinal"
main = "worker-h196.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H196: preserve the H178/H193/H195 three-screen layout and Full Board position
# memory, but intercept the legacy H176 Full Board click reset so returning to
# Full Board does not visibly jump to the opponent-board top before restoring.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
