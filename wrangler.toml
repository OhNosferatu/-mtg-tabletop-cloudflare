name = "mtg-tabletop-cloudflarefinal"
main = "worker-h146.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H146: preserve H145/H144/H142 behavior while forcing Draw 1 / Mulligan /
# Untap All to remain fixed and visible on Full Board with no dropdown. Also
# keep empty deck zones visually empty so no card-back image appears at count 0.
# No gameplay, board geometry, dragging, snapping, or gesture behavior changes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
