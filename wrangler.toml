name = "mtg-tabletop-cloudflarefinal"
main = "worker-h106.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H106: keep H105's continuous 153.846%-height Full Board and scrubber, but
# map cards by their true percentage positions within each player's half so the
# overview mirrors Your Side/Opponent instead of bunching cards toward center.
# Full Board images use contain sizing to avoid cropping card artwork.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
