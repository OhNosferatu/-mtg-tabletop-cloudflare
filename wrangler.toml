name = "mtg-tabletop-cloudflarefinal"
main = "worker-h214.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H214 keeps H213/H212 as the stable gameplay and visual baseline and applies
# the same screen-parity approach used successfully on the opponent piles:
# Full Board remains the player-pile anchor while only the dedicated Your Side
# pile column is shifted right. Vertical spacing, pile order, fonts, and behavior
# remain unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
