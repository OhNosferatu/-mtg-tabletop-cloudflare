name = "mtg-tabletop-cloudflarefinal"
main = "worker-h74.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H74: preserve complete token discovery and prehydrate generated token art/face
# data so token interactions do not trigger card lookups during iOS viewer opens.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
