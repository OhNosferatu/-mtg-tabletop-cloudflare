name = "mtg-tabletop-cloudflarefinal"
main = "worker-h134.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H134: preserve H133 battlefield geometry and the two-line divider. Reorder the
# center strip to [blue life + your hand] [turn switch] [turn + timer]
# [opponent hand + red life], hide the old floating hand chips, and keep life
# totals/hand counts synchronized with the existing game-owned state.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
