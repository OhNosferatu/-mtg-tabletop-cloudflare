name = "mtg-tabletop-cloudflarefinal"
main = "worker-h48.js"
compatibility_date = "2026-08-31"

# H48: tapping any non-empty deck pile opens deck options; the preview follows
# the actually visible face, including the original bottom card after flipping.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
