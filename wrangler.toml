name = "mtg-tabletop-cloudflarefinal"
main = "worker-h60.js"
compatibility_date = "2026-08-31"

# H60: preserve each card's own face orientation when placed on the deck and
# remove Scry header text while keeping Scry and compact Hand strips separated.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
