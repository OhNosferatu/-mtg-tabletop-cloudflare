name = "mtg-tabletop-cloudflarefinal"
main = "worker-h176.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H176: bypass H174/H175 board-bound experiments. Bind Full Board to the actual
# H105 scroll viewport and make its content exactly opponent board + 58px divider
# + player board, preserving H173 opponent token ownership and shared coordinates.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
