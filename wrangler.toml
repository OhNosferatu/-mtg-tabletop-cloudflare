name = "mtg-tabletop-cloudflarefinal"
main = "worker-h142.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H142: preserve H141/H139 behavior and visuals, but brighten the neutral gray
# battlefield surface. Blue player/red opponent accents, divider, hand counts,
# geometry, dragging, snapping, and gestures are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
