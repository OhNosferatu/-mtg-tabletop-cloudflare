name = "mtg-tabletop-cloudflarefinal"
main = "worker-h188.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H188: clean redeploy of the previously approved H186 behavior. No geometry or
# control changes; this is a fresh deployment checkpoint to clear the failed H187
# mirror experiment from the active worker path.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
