name = "mtg-tabletop-cloudflarefinal"
main = "worker-h37.js"
compatibility_date = "2026-08-31"

# H37: bundle the game HTML into the Worker at deploy time.
# CSS/JS/images remain static assets; APIs delegate to the existing game worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
