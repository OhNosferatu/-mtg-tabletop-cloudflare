name = "mtg-tabletop-cloudflarefinal"
main = "worker-h87.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H87: rebuild Mulligan from the original imported deck data instead of
# manipulating live card objects. Preserve H83 token/tap-indicator behavior.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
