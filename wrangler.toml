name = "mtg-tabletop-cloudflarefinal"
main = "worker-h186.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H186 restored as the stable pile-layout baseline. H187 mirror experiment is
# disabled because it caused opponent piles to overlap again.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
