name = "mtg-tabletop-cloudflarefinal"
main = "worker-h40.js"
compatibility_date = "2026-08-31"

# H40: keep the reliable visible asset loader and replace battlefield double-tap
# inspect previews with a lightweight full-screen zoom to avoid iOS freezes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
