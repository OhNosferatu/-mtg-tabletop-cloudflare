name = "mtg-tabletop-cloudflarefinal"
main = "worker-h206.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H206 keeps H205 geometry, pile colors, spacing, fonts, and behavior intact while
# removing visual shadow effects across the game UI for a flatter, uniform look.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
