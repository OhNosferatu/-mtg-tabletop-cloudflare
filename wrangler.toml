name = "mtg-tabletop-cloudflarefinal"
main = "worker-h99.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H99: preserve H98 search/viewer behavior and lower the auto-snap overlap
# threshold for Commander, Graveyard, Deck, Exile, and Tokens from 80% to 60%.
# Battlefield card-to-card stacking remains unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
