name = "mtg-tabletop-cloudflarefinal"
main = "worker-h104.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H104: make Full Board a vertically scrollable two-page table. Opponent gets
# one full board-height page and Your Side gets a second page below it, with
# normal card scale/placement and vertical scroll snapping between the sides.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
