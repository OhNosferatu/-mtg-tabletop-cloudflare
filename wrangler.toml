name = "mtg-tabletop-cloudflarefinal"
main = "worker-h231.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H231 returns to H229 as the gameplay/geometry baseline and fixes dedicated
# Opponent double-tap recognition at the source. H124's first-tap viewer timer is
# extended only on the dedicated Opponent screen, giving iPhone Safari more time
# to receive the second tap before treating the first as a single tap. H209's
# fallback viewer delay is extended to match. All other screens keep their prior
# gesture timing, and H229's tapped-card alignment remains unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
