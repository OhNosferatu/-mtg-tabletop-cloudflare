name = "mtg-tabletop-cloudflarefinal"
main = "worker-h243.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H243 keeps H242's card shape and the established one-to-one board geometry.
# Card-to-card overlap snapping is disabled on Your Side, Opponent, and Full Board,
# so battlefield cards remain exactly where released. The five pile/zone targets
# retain their existing magnetic/snap behavior.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
