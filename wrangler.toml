name = "mtg-tabletop-cloudflarefinal"
main = "worker-h226.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H226 keeps H225/H223 gameplay, card, pile, land-zone, and opponent geometry
# intact. Opponent -> Full Board remains unchanged because it is already stable.
# Your Side -> Full Board now keeps Your Side painted while Full Board is briefly
# laid out invisibly at the deterministic player anchor, reasserts that anchor for
# several paint frames, then atomically reveals Full Board. This prevents Safari
# from exposing the natural opponent/top scroll position during the transition.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
