name = "mtg-tabletop-cloudflarefinal"
main = "worker-h162.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H162: preserve H161 top controls and gameplay. Inventory now opens a dedicated
# modal styled like Import Deck, with an empty placeholder area ready for future
# mana counters and other inventory items.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
