name = "mtg-tabletop-cloudflarefinal"
main = "worker-h149.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H149: bypass H148's Full Board pile-layer observer after token spawning regressed.
# Preserve H147 hand-count behavior and all prior visuals/interactions, while keeping
# empty Full Board deck art suppressed using a source-deck-only sync that does not
# observe or rewrite token pile layers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
