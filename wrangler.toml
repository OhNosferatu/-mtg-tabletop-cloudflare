name = "mtg-tabletop-cloudflarefinal"
main = "worker-h169.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H169: preserve H168 coordinate/mulligan behavior. Add a generic white Counter
# inventory token with black centered values (including negatives), and expand
# persistent delete/undo mode to all movable cards, including pile-top cards.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
