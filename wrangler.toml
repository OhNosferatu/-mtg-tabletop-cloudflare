name = "mtg-tabletop-cloudflarefinal"
main = "worker-h81.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H81: preserve H79 interaction/mulligan fixes, discover only token cards
# actually created by main-deck/Commander Oracle text, and use double-tap on
# the Tokens pile to open the stable full-card viewer.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
