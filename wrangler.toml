name = "mtg-tabletop-cloudflarefinal"
main = "worker-h209.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H209 keeps H208 as the stable visual/layout baseline and restores reliable
# single-tap fullscreen viewing for battlefield cards without changing double-tap
# rotate, long-press drag, pile/land geometry, scrolling, or mana-token editing.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
