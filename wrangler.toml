name = "mtg-tabletop-cloudflarefinal"
main = "worker-h108.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H108: keep H107 Full Board card rendering, positioning, and continuous scroll,
# but remember the Full Board vertical scroll position when switching to another
# view and restore that exact position when returning to Full Board.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
