name = "mtg-tabletop-cloudflarefinal"
main = "worker-h62.js"
compatibility_date = "2026-08-31"

# H62: refresh the custom Hand scrollbar whenever the Hand tray opens/closes
# or its rendered row changes size, including cards added while Hand is closed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
