name = "mtg-tabletop-cloudflarefinal"
main = "worker-h141.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H141: revert H140 active-turn battlefield glow and restore the H139 visual
# state: neutral graphite-gray board with blue player and red opponent identity
# accents, while preserving all prior divider, hand-count, geometry, and gesture
# behavior. No gameplay or layout changes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
