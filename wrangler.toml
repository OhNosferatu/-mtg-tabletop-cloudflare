name = "mtg-tabletop-cloudflarefinal"
main = "worker-h256.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H256 fixes the empty deck at the source stylesheet: the card-back pseudo-card
# is now created only when the deck is not empty. It also hides any stale child
# deck image whenever the pile is marked empty. H255 Reveal Top / Flip Deck and
# the H254/H253 interaction fixes remain unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
