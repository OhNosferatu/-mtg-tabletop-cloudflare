name = "mtg-tabletop-cloudflarefinal"
main = "worker-h187.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H187 builds on stable H186 and makes the opponent pile column a direct
# vertical mirror of the player pile column while preserving all H186 geometry.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
