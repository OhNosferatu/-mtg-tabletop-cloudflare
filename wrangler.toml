name = "mtg-tabletop-cloudflarefinal"
main = "worker-h96.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H96: preserve the H95 zone browser and Deck search, remove search buttons
# from the Tokens/Graveyard/Exile piles, and show a context-sensitive Search
# button beside the enlarged top card for those three zones instead.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
