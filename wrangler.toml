name = "mtg-tabletop-cloudflarefinal"
main = "worker-h250.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H250 keeps H247's confirmed Full Board free-placement/overlap behavior, but
# removes H248/H249's separate Full Board pile state model. Full Board pile drags
# now call the same canonical movement helpers used by the dedicated Your Side
# and Opponent screens; Full Board only maps coordinates and performs pile hit
# testing. H122's competing Full Board pile controller is disabled.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
