name = "mtg-tabletop-cloudflarefinal"
main = "worker-h220.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H220 keeps H219/H217 as the gameplay, pile, and layout baseline but fixes the
# Full Board fixed-anchor timing bug. The divider position is now measured only
# after Full Board is visible in layout, preventing Safari from reading offsetTop
# as zero and sending the viewport to the opponent/top edge.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
