name = "mtg-tabletop-cloudflarefinal"
main = "worker-h158.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H158: preserve the working H157 Opponent overlay. Keep only one opponent life
# counter on the Opponent view, positioned top-left, and restore the player's
# normal hand bar so the player can inspect their hand while viewing Opponent.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
