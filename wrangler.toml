name = "mtg-tabletop-cloudflarefinal"
main = "worker-h221.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H221 returns to H217 as the confirmed gameplay/layout baseline. Full Board now
# stays laid out while inactive (visibility:hidden instead of display:none), so
# Safari preserves its real scrollTop. Legacy center/top/open-restore writes are
# disabled, removing the competing programmatic scroll changes that caused the
# visible transition jitter. The last Full Board scroll position is preserved.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
