name = "mtg-tabletop-cloudflarefinal"
main = "worker-h234.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H234 keeps H233's Opponent view/hand synchronization and extends only the
# dedicated Opponent double-tap window to 650ms. The older single-tap viewer
# fallback waits 725ms on that screen. Your Side, Full Board, and the separate
# opponent coordinate plane are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
