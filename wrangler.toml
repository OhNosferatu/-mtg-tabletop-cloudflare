name = "mtg-tabletop-cloudflarefinal"
main = "worker-h241.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H241 keeps H240's one-to-one card sizing and full-size board geometry. The
# dedicated Opponent card shape is the corner-clipping source of truth: Your Side,
# Opponent, and Full Board now use the same 7px outer radius with a single shared
# overflow clip, so the amount cut from each card corner is visually identical.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
