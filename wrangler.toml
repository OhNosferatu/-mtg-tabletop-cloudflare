name = "mtg-tabletop-cloudflarefinal"
main = "worker-h128.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H128: preserve H127 counter-font synchronization and all H126 gesture fixes.
# Tie the visible in-game build label directly to /api/health so the browser
# version display cannot lag behind the actually deployed worker again.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
