name = "mtg-tabletop-cloudflarefinal"
main = "worker-h85.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H85: preserve the stable H83 interaction/token/tap-indicator stack and make
# Mulligan restore exact imported card-id snapshots before shuffling/dealing 7.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
