name = "mtg-tabletop-cloudflarefinal"
main = "worker-h94.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H94: preserve H93 full-card layout, add a four-column searchable browser for
# Deck, Tokens, Graveyard, and Exile with a dedicated three-action card viewer,
# and restore single-tap full-screen behavior for the top Token pile card.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
