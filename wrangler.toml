name = "mtg-tabletop-cloudflarefinal"
main = "worker-h107.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H107: keep H106 Full Board positioning and continuous scroll behavior, but
# isolate miniature Full Board cards from normal battlefield image cropping.
# Full Board images now render at their natural card aspect ratio so the entire
# Scryfall card face remains visible at miniature scale.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
