name = "mtg-tabletop-cloudflarefinal"
main = "worker-h219.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H219 keeps H218/H217 as the confirmed gameplay, pile, and layout baseline but
# changes Full Board opening to one fixed visual anchor: the match divider is
# aligned to the top of the Full Board viewport, matching the user's reference
# screenshot. Saved scroll position is no longer used as the opening target.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
