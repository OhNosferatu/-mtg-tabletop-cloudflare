name = "mtg-tabletop-cloudflarefinal"
main = "worker-h38.js"
compatibility_date = "2026-08-31"

# H38: render the game shell immediately, then load frontend assets one-by-one
# with visible status and timeouts so a single bad asset cannot leave a white page.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
