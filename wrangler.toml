name = "mtg-tabletop-cloudflarefinal"
main = "worker-h184.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H184: preserve H183/H180 stable Full Board geometry and permanently pin the
# Draw/Mulligan/Untap/dropdown action row immediately above the board so Mulligan
# and other state changes cannot hide or collapse it.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
