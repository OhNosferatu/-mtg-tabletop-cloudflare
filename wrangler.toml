name = "mtg-tabletop-cloudflarefinal"
main = "worker-h95.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H95: preserve H94 searchable Deck/Tokens/Graveyard/Exile browser, restore the
# original absolute board-zone positioning, attach Deck search to the actual
# isolated deck overlay panel, and make search buttons reliable on iOS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
