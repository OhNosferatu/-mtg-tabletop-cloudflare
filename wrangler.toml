name = "mtg-tabletop-cloudflarefinal"
main = "worker-h115.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H115: keep H114's two full-size, continuously scrolling battlefield halves,
# and move each life indicator into the normal top-right position of its own
# full-size side so Full Board mirrors Your Side / Opponent more directly.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
