name = "mtg-tabletop-cloudflarefinal"
main = "worker-h103.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H103: preserve H102 Full Board geometry and controls, but shrink the Full
# Board card footprint from 46px to 38px for a cleaner two-player overview.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
