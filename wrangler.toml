name = "mtg-tabletop-cloudflarefinal"
main = "worker-h207.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H207 keeps H206 intact and removes the remaining Full Board pile shadows with
# higher-specificity overrides for the opponent and player pile columns.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
