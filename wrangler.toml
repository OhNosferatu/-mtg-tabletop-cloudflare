name = "mtg-tabletop-cloudflarefinal"
main = "worker-h119.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H119: Full Board is two exact copies of the normal side-board geometry stacked
# vertically. Cards and piles use the same global physical dimensions as Your
# Side, with no separate Full Board scaling or coordinate remapping.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
