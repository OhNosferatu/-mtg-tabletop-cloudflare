name = "mtg-tabletop-cloudflarefinal"
main = "worker-h167.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H167: preserve H166 mana-token artwork/editor. Remove the token-editor Close
# button in favor of backdrop dismissal, center token values, and add persistent
# delete mode plus last-deletion Undo controls to the top dropdown menu.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
