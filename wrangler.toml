name = "mtg-tabletop-cloudflarefinal"
main = "worker-h171.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H171: preserve H170 board-coordinate tracking. Inventory tokens/counters are
# now dragged directly from Inventory onto the player's visible battlefield;
# Inventory turns translucent during the drag and returns to normal on release.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
