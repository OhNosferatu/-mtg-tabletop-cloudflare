name = "mtg-tabletop-cloudflarefinal"
main = "worker-h236.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H236 keeps H235's tab/view synchronization, hand availability, hand-to-opponent
# drop path, separate opponent coordinates, and existing Full Board behavior. The
# dedicated Opponent card renderer now removes its old immediate onclick viewer
# handler, matching Full Board so H124 exclusively owns single tap, double tap,
# and long-press behavior on battlefield cards.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
