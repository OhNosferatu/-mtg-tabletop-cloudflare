<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MTG Tabletop Desktop v1</title><link rel="stylesheet" href="/style.css?v=20260831-5"><link rel="stylesheet" href="/controls.css?v=20260831-5"></head><body>
<div class="bar"><div class="tabs"><button class="on" data-v="you">Your Side</button><button data-v="full">Full Board</button><button data-v="opp">Opponent</button></div><button id="import">Import</button><span id="desktopHint" style="display:none;font-size:9px;color:#b9aa98;margin-left:4px">Desktop: drag cards · double-click to tap · H toggles hand · Esc closes overlays</span></div>
<div class="tools"><button id="draw">Draw 1</button><button id="mulligan">Mulligan</button><button id="untap">Untap All</button></div>
<div id="board" class="board">
<section id="you" class="screen on"><div class="title">YOUR SIDE</div><div id="cmds" class="cmds"></div><div id="discard" class="zone discard" data-name="DISCARD" data-icon="☠"></div><div id="deck" class="zone deck empty" data-name="DECK"></div><div id="exile" class="zone exile" data-name="EXILE" data-icon="✦"></div><div id="tokens" class="zone tokens" data-name="TOKENS" data-icon="◉"></div><div id="side" class="zone side" data-name="SIDEBOARD" data-icon="▤"></div><div id="field"></div><div class="life you" data-life="you"><button data-life-change="-1">−</button><span>♥ <b data-life-value>40</b></span><button data-life-change="1">+</button></div></section>
<section id="full" class="screen"><div class="title">FULL BOARD</div><div id="fullcards"></div><div class="life opp" data-life="opp"><button data-life-change="-1">−</button><span>♥ <b data-life-value>40</b></span><button data-life-change="1">+</button></div><div class="life you" data-life="you"><button data-life-change="-1">−</button><span>♥ <b data-life-value>40</b></span><button data-life-change="1">+</button></div></section>
<section id="opp" class="screen"><div class="title">OPPONENT</div><div id="oppcards"></div><div class="life opp" data-life="opp"><button data-life-change="-1">−</button><span>♥ <b data-life-value>40</b></span><button data-life-change="1">+</button></div></section></div>
<aside id="hand" class="hand empty"><div class="handhead"><b>Your Hand</b><button id="closehand" class="close">Close</button></div><div id="handrow" class="handrow"></div></aside>
<div id="imp" class="modal"><div class="box"><h3>Import Deck</h3><div class="methods"><button id="urlm" class="on">Deck URL</button><button id="listm">Card List</button></div><div id="urlp" class="pane on"><input id="url" placeholder="https://archidekt.com/decks/..."></div><div id="listp" class="pane"><textarea id="list"></textarea></div><div id="msg" class="msg">Archidekt URL is preferred.</div><div class="actions"><button id="cancel">Cancel</button><button id="run">Import</button></div></div></div>
<div id="inspect" class="inspect"><div class="previewwrap"><div class="preview"><img id="pimg"></div><div id="ctrl" class="ctrl"><button id="one">+1/+1</button><button id="manual">X/X</button><div id="xx" class="xx"><input id="px" inputmode="numeric" placeholder="P"><input id="tx" inputmode="numeric" placeholder="T"><button id="apply">Apply</button></div></div></div></div><div id="toast" class="toast"></div>
<script src="/app.js?v=20260831-5" defer></script><script src="/deck-state.js?v=20260831-5" defer></script></body></html>
