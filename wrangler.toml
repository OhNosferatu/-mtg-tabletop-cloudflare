name = "mtg-tabletop-cloudflarefinal"
main = "worker-h80.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H80: preserve H79 interaction/mulligan fixes, but derive imported token
# options only from Archidekt's Tokens-category source cards using batched
# Scryfall related-token lookup instead of scanning the entire deck.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
