name = "mtg-tabletop-cloudflarefinal"
main = "worker-h233.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H233 keeps H232's dedicated Opponent gesture contract and synchronizes the
# visually active tab with the internal game view. The player's hand remains
# available on the Opponent screen and H211/H223 place hand cards directly into
# the dedicated opponent coordinate plane. Full Board behavior is unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
