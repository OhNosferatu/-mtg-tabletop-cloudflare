name = "mtg-tabletop-cloudflarefinal"
main = "worker-h251.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H251 branches from H247 and removes H248-H250's Full Board pile experiments.
# It restores the confirmed H201/H203 pile geometry, keeps the original H117/H122
# pile interaction system, and changes only Full Board battlefield-to-pile hit
# testing to the same 80% card-overlap rule used by the dedicated board. Opponent
# deck counts are adjusted when known cards move into/out of that deck.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
