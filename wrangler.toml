name = "mtg-tabletop-cloudflarefinal"
main = "worker-h238.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H238 keeps H237/H236 behavior intact and changes only the initial screen on
# page load: the game always starts on Your Side instead of restoring Full Board
# or another previously selected tab from sessionStorage. Normal tab switching
# after load is unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
