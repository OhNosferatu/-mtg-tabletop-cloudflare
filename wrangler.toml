name = "mtg-tabletop-cloudflarefinal"
main = "worker-h180.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H180: preserve the H179 full-board-only experiment. Use one authoritative
# semantic pile layout for both halves and suppress legacy pseudo-land/boundary
# artifacts that could appear as a green horizontal line.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
