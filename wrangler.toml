name = "mtg-tabletop-cloudflarefinal"
main = "worker-h120.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H120: preserve H119's exact one-to-one Full Board geometry and restore visible
# Commander/Discard/Deck/Exile/Tokens pile columns for both players at the same
# physical sizes and relative positions used by the normal side boards.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
