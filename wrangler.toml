name = "mtg-tabletop-cloudflarefinal"
main = "worker-h36.js"
compatibility_date = "2026-08-31"

# H36: entry worker materializes HTML responses explicitly, while delegating APIs
# to the existing game worker and serving CSS/JS/images directly from Assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
