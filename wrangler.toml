name = "mtg-tabletop-cloudflarefinal"
main = "worker-h124.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H124: preserve H123/H122 Full Board geometry and pile interaction, but split
# battlefield card gestures cleanly: single tap opens the full-card viewer,
# double tap rotates/taps the card, and a 360ms long press arms drag movement.
# The yellow selection outline and Full Board scroll freeze begin only after
# the long press is armed, preventing taps and drags from interfering.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
