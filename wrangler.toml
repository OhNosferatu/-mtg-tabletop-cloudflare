name = "mtg-tabletop-cloudflarefinal"
main = "worker-h152.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H152: preserve H151 graveyard terminology and all current Full Board/player
# behavior while turning Opponent Side into a public-information control board.
# Opponent public cards/piles are interactive, hidden hand stays count-only, and
# pile order is Commander -> Exile -> Deck -> Graveyard -> Tokens with red identity.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
