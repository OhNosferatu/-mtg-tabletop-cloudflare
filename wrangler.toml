name = "mtg-tabletop-cloudflarefinal"
main = "worker-h185.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H185: preserve H184 fixed action row and H180 stable board geometry. Anchor
# each Full Board pile directly to its owner's one-board coordinate system so
# opponent/player pile columns cannot overlap or drift across the divider.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
