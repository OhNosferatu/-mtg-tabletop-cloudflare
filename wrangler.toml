name = "mtg-tabletop-cloudflarefinal"
main = "worker-h135.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H135: preserve H134 divider layout and H133 battlefield geometry. Fix divider
# hand counters by reading the live rendered hand row directly for Your Hand,
# observing hand DOM changes, and keeping the opponent count mirrored from the
# existing opponent public hand-count source.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
