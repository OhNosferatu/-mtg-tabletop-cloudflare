name = "mtg-tabletop-cloudflarefinal"
main = "worker-h73.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H73: preserve H71 complete token discovery, and make cards in the Tokens pile
# use normal card controls plus safe battlefield/Hand dragging on iOS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
