name = "mtg-tabletop-cloudflarefinal"
main = "worker-h211.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H211 keeps the confirmed H210 visual/gesture baseline and allows battlefield
# cards to change controller by crossing the Full Board divider. The player's
# private hand can also place cards directly onto the opponent battlefield, and
# dedicated views support transferring a field card via the opposite board tab.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
