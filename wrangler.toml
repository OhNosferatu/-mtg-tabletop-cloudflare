name = "mtg-tabletop-cloudflarefinal"
main = "worker-h156.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H156: replace the entire dedicated Opponent section in served HTML rather than
# appending runtime UI into the legacy opponent screen. This guarantees the
# mirrored board structure is present: Tokens -> Graveyard -> Deck -> Exile ->
# Commander, land zone at the top, bottom life, and count-only opponent hand.
# Full Board and Your Side remain unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
