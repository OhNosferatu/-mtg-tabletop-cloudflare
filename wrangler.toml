name = "mtg-tabletop-cloudflarefinal"
main = "worker-h205.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H205 keeps H204 geometry and shadow behavior, standardizes opponent pile
# outlines to one exact red across Opponent and Full Board, and pins player pile
# outlines to one exact blue across Your Side and Full Board.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
