name = "mtg-tabletop-cloudflarefinal"
main = "worker-h174.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H174: preserve H173 opponent token/card behavior. Lock Full Board to exactly
# one opponent board + 58px divider + one player board, clamp scrolling to those
# bounds, and keep dedicated board screens fixed to one normal battlefield.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
