name = "mtg-tabletop-cloudflarefinal"
main = "worker-h218.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H218 keeps H217 as the confirmed pile/layout baseline and removes only the two
# legacy Full Board opening scroll moves (H105 center + H176 top reset) that were
# fighting H178's saved scroll-position restore. Full Board should now reopen at
# the exact spot it was left without first jumping toward the opponent/top side.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
