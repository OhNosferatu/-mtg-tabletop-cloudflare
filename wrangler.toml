name = "mtg-tabletop-cloudflarefinal"
main = "worker-h253.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H253 builds on H252's live canonical Full Board sync. It restores the intended
# 60% pile-overlap snap threshold from H99/H117, allows the private Scry tray to
# display while Full Board is active, and makes Full Board deck rendering follow
# the same visible-card / Reveal Top / Flip Deck state as the dedicated player
# deck. Draw, Mill, Shuffle, pile interactions, and H247 free placement stay intact.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
