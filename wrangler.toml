name = "mtg-tabletop-cloudflarefinal"
main = "worker-h163.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H163: preserve H162 inventory modal size. Lock the inner inventory area height
# and add a subtle right-side floating scrollbar that only appears when future
# inventory items overflow the available space.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
