name = "mtg-tabletop-cloudflarefinal"
main = "worker-h109.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H109: keep H108 Full Board scroll-position memory and H107 card rendering,
# while moving the Full Board scrubber inward, enlarging its mobile touch target,
# and restyling it to match the table's dark wood / brass board aesthetic.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
