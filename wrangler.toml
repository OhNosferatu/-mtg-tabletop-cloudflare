name = "mtg-tabletop-cloudflarefinal"
main = "worker-h210.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H210 keeps H209 behavior intact and removes the remaining Full Board card
# drop-shadow/box-shadow with higher-specificity selectors. Card gestures,
# fullscreen viewing, piles, land zones, scrolling, and token behavior are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
