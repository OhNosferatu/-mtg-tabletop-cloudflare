name = "mtg-tabletop-cloudflarefinal"
main = "worker-h139.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H139: preserve H138/H137/H136 behavior while replacing the old green felt/base
# treatment with neutral graphite gray. Blue player and red opponent identity
# accents remain in place; board geometry and interactions are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
