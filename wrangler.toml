name = "mtg-tabletop-cloudflarefinal"
main = "worker-h97.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H97: preserve H96 zone-browser behavior, remove board-level search icons from
# Tokens/Graveyard/Exile entirely, and match the full-screen Search button size
# to the compact Deck Search control.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
