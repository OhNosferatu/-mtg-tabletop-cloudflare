name = "mtg-tabletop-cloudflarefinal"
main = "worker-h204.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H204 keeps the confirmed H203 pile geometry and removes only the inherited
# inset shadow from the dedicated Opponent-screen pile boxes. Full Board piles,
# cards, land zones, scrolling, board sizing, fonts, and gestures are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
