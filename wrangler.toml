name = "mtg-tabletop-cloudflarefinal"
main = "worker-h197.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H197 returns to the H195/H178 stable geometry and hides only the Full Board
# scroll viewport during H178's existing saved-position restoration window. This
# removes the visible intermediate snap without changing piles or board layout.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
