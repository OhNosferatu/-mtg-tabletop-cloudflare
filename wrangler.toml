name = "mtg-tabletop-cloudflarefinal"
main = "worker-h172.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H172: preserve H171 inventory drag/drop. Align the Full Board opponent half
# with the dedicated Opponent view by using the same exact opponent land-zone
# geometry and full-screen opponent card coordinate plane.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
