name = "mtg-tabletop-cloudflarefinal"
main = "worker-h199.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H199 returns to the H197 stable baseline and fixes only the dedicated Opponent
# land-zone rule with enough specificity to override H172. No pile, card, scroll,
# or board behavior is changed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
