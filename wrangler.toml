name = "mtg-tabletop-cloudflarefinal"
main = "worker-h110.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H110: keep H109 Full Board scrollbar improvements, H108 scroll-position memory,
# and H107 card rendering, while adding matching land zones to both the opponent
# half and the player's half of Full Board.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
