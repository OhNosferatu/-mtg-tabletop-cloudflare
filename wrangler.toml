name = "mtg-tabletop-cloudflarefinal"
main = "worker-h168.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H168: mana tokens now share the same battlefield coordinate space as cards
# across Your Side and Full Board. Mulligan clears placed inventory mana tokens.
# Delete mode keeps its dropdown tray open, including while using Undo.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
