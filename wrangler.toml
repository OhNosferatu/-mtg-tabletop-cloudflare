name = "mtg-tabletop-cloudflarefinal"
main = "worker-h160.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H160: preserve the working H159 opponent overlay/hand behavior. Remove the
# Opponent label and make the single opponent life heart exactly match Your Side
# in size and vertical placement, mirrored to the left edge.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
