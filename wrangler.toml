name = "mtg-tabletop-cloudflarefinal"
main = "worker-h84.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H84: preserve H83 token/tap behavior, but make Mulligan an immediate table
# reset with nonblocking in-place Hand artwork loading to avoid iOS freezes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
