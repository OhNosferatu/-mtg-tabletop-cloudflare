name = "mtg-tabletop-cloudflarefinal"
main = "worker-h232.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H232 returns to H229 as the stable gameplay/geometry baseline and removes the
# H230/H231 dedicated-opponent double-tap experiments. Dedicated Opponent cards
# now use their own copy of the exact H124 battlefield gesture contract before
# the older document-level recognizer: single tap opens the viewer, double tap
# rotates 90 degrees, and long press moves the card. The same H124 action bridge
# remains the single source of truth, while Your Side and Full Board are untouched.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
