name = "mtg-tabletop-cloudflarefinal"
main = "worker-h223.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H223 keeps H222's accepted Full Board transition/scroll behavior intact while
# restoring exact opponent land-zone parity and keeping dedicated Opponent card
# movement on the dedicated #oppcards coordinate plane rather than Full Board's
# half-board geometry.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
