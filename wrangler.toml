name = "mtg-tabletop-cloudflarefinal"
main = "worker-h255.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H255 keeps H254's render-stability and 60% opponent-pile snap fixes. Empty
# deck piles no longer paint the global CSS card-back pseudo-element, and Reveal
# Top / Flip Deck now use direct authoritative deck-state + overlay rendering so
# they behave consistently from Your Side and Full Board.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
