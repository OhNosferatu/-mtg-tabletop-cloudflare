name = "mtg-tabletop-cloudflarefinal"
main = "worker-h122.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H122: keep H121's exact Full Board sizing and mirrored opponent piles, while
# restoring reliable player-pile interaction on Full Board: tap to inspect,
# drag top cards onto the battlefield/hand/other public piles, and keep deck
# interactions routed through the existing deck controls.
# Deployment retrigger: 2026-09-02.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
