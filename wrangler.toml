name = "mtg-tabletop-cloudflarefinal"
main = "worker-h198.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H198 keeps the H197 three-screen baseline and changes only the dedicated
# Opponent-screen land zone so its geometry matches the Full Board opponent land
# zone exactly. No pile, card, scroll, or board behavior is changed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
