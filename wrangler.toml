name = "mtg-tabletop-cloudflarefinal"
main = "worker-h101.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H101: preserve H100 Full Board Phase 1, shrink overview cards to better match
# Your Side scale/placement, and collapse Draw/Mulligan/Untap by default only
# in Full Board behind a small centered dropdown toggle.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
