name = "mtg-tabletop-cloudflarefinal"
main = "worker-h213.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H213 keeps H212 as the stable gameplay/visual baseline and only nudges the
# dedicated Your Side pile column slightly right so it matches the Full Board
# player pile column. Vertical spacing, pile order, fonts, and behavior are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
