name = "mtg-tabletop-cloudflarefinal"
main = "worker-h113.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H113: keep H112 direct board scrolling and full-width land zones, but mirror
# the opponent land zone to the top of the opponent half instead of placing it
# just above the center divider.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
