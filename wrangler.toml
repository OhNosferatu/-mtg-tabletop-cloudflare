name = "mtg-tabletop-cloudflarefinal"
main = "worker-h127.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H127: preserve H126 gesture behavior and H125 combined counter mechanics.
# Synchronize the battlefield counter typography on Your Side and Opponent to
# the computed Full Board counter typography so all board views use the exact
# same font size, line height, and weight.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
