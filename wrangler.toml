name = "mtg-tabletop-cloudflarefinal"
main = "worker-h230.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H230 keeps H229/H228 geometry, screen switching, scroll behavior, opponent land
# parity, drag-plane fixes, and tapped-card transform-origin parity intact. It adds
# only a narrow dedicated-Opponent Safari double-tap fallback: H124 remains the
# primary gesture system, and H230 invokes the same H124 rotate bridge only when
# a clean double tap reaches pointerup but the card's tap state did not change.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
