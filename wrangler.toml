name = "mtg-tabletop-cloudflarefinal"
main = "worker-h189.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H189: lock Full Board vertical geometry to fixed dimensions: each player side
# 610px, divider 58px, total board 1278px, land-zone height 164.7px. Safari
# viewport changes may change how much is visible, but cannot resize the board.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
