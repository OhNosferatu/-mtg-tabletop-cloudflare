name = "mtg-tabletop-cloudflarefinal"
main = "worker-h154.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H154: dedicated Opponent tab is now a true vertical mirror of Your Side.
# Mirrored piles are Tokens -> Graveyard -> Deck -> Exile -> Commander, the land
# zone sits at the top of the battlefield, opponent hand remains count-only, and
# H152/H153 experimental opponent UI is bypassed. Full Board/player logic unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
