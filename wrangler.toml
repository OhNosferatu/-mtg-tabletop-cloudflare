name = "mtg-tabletop-cloudflarefinal"
main = "worker-h90.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H90: preserve the stable H89 page-reload Mulligan and replace the Hand
# header label with a live card counter driven by the current hand size.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
