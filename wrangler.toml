name = "mtg-tabletop-cloudflarefinal"
main = "worker-h150.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H150: preserve H149 stable token spawning, H147 hand counts, fixed Full Board
# action buttons, lighter-gray battlefield, and turn colors. Reorder pile columns
# to Commander -> Exile -> Deck -> Graveyard -> Tokens for the player perspective,
# mirror that order on the opponent Full Board half, and rename all player-facing
# Discard labels/actions to Graveyard while keeping the internal discard zone key.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
