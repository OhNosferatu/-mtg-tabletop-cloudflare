name = "mtg-tabletop-cloudflarefinal"
main = "worker-h217.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H217 returns to H212 as the stable gameplay baseline and replaces the H213-H216
# horizontal pile experiments with an exact runtime measurement from the visible
# Full Board screen edge to the Full Board player pile edge. That same pixel gap
# is applied to Your Side through a parent CSS variable, preventing H116 clones
# from feeding the adjustment back into Full Board. Vertical spacing, pile order,
# fonts, colors, land zones, scrolling, and interactions are unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
