name = "mtg-tabletop-cloudflarefinal"
main = "worker-h194.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H194: preserve the H178 three-screen layout and H193 green-line fix while
# stabilizing tab switching and restoring the last Full Board scroll position.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
