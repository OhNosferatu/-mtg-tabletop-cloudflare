name = "mtg-tabletop-cloudflarefinal"
main = "worker-h181.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H181: full-board-only layout. Remove the remaining Full Board selector row,
# expand both battlefield canvases by the reclaimed height while keeping land
# zones at their prior pixel size, and color pile labels by active turn
# (opponent red / player blue; inactive side neutral gray).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
