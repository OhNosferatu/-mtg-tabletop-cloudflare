name = "mtg-tabletop-cloudflarefinal"
main = "worker-h93.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H93: preserve H92 counter/reset behavior, but correct the full-card control
# layout to Tap/Flip/To Hand, X/X/counters/resets, and a centered bottom row
# of Exile/Discard unless a card-state button is present.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
