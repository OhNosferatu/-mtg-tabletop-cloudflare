name = "mtg-tabletop-cloudflarefinal"
main = "worker-h229.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H229 keeps H228's restored H197/H178 screen-switching and scroll behavior,
# opponent land-zone parity, and dedicated Opponent drag-plane fix. It corrects
# only tapped opponent-card visual parity: dedicated Opponent and Full Board now
# rotate opponent cards around the same center transform origin, so tapping a card
# cannot make it appear to shift horizontally between the two views.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
