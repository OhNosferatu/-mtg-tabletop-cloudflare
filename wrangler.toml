name = "mtg-tabletop-cloudflarefinal"
main = "worker-h153.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H153: preserve H152/H151 behavior, but add a robust HTML-side fallback so the
# Opponent public-control UI is visibly rendered on iOS Safari even if the H152
# app.js runtime hook fails. Shows Commander -> Exile -> Deck -> Graveyard ->
# Tokens, opponent life, and count-only hand without changing player/full-board logic.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
