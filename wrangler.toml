name = "mtg-tabletop-cloudflarefinal"
main = "worker-h116.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H116: keep H115's full-size continuous Full Board and life positioning, add
# separate Commander/Discard/Deck/Exile/Tokens pile columns for both players,
# restore land-zone margins around those piles, and dynamically match Full Board
# card width to the exact computed card size used on Your Side.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
