name = "mtg-tabletop-cloudflarefinal"
main = "worker-h245.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H245 keeps H244's dedicated-board drag fix, H243 free placement, and H242 card
# shape. Full Board now commits movement by applying the exact pointer drag delta
# to the card's existing stored x/y coordinates instead of reconstructing its
# position from client-space coordinates through the stacked board/divider map.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
