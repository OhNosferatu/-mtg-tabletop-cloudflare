name = "mtg-tabletop-cloudflarefinal"
main = "worker-h215.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H215 keeps H214/H212 gameplay and visual behavior intact and only fine-tunes
# the dedicated Your Side pile column to the midpoint between the prior slightly
# left (2.5%) and slightly right (3%) positions. Vertical spacing, pile order,
# fonts, colors, Full Board geometry, and interactions remain unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
