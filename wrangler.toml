name = "mtg-tabletop-cloudflarefinal"
main = "worker-h228.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H228 returns screen switching and Full Board scroll behavior to the exact
# H217 -> H197/H178 system that was previously confirmed stable, removing all
# H218-H227 transition/prewarm/source-anchor experiments. It retains the current
# opponent land-zone parity and dedicated Opponent drag-plane corrections without
# changing card, pile, land-zone, or gameplay geometry.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
