name = "mtg-tabletop-cloudflarefinal"
main = "worker-h70.js"
compatibility_date = "2026-08-31"

# H70: keep the proven H64 build-time chain, while separating Flip/Unflip deck
# state from individual Reveal/Unreveal card state at runtime.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
