name = "mtg-tabletop-cloudflarefinal"
main = "worker-h58.js"
compatibility_date = "2026-08-31"

# H58: keep H57's stacked Scry + Hand layout while making Scry drags track
# reliably from pointer-down and giving the per-card arrow controls full height.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
