name = "mtg-tabletop-cloudflarefinal"
main = "worker-h246.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H246 keeps H244's confirmed Your Side/Opponent drag behavior and H243 free
# battlefield placement. Full Board now commits the exact drag-ghost rectangle
# through the established one-to-one Full Board coordinate helper, matching the
# dedicated boards instead of using H245's delta experiment.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
