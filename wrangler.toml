name = "mtg-tabletop-cloudflarefinal"
main = "worker-h55.js"
compatibility_date = "2026-08-31"

# H55: preserve a card's current face orientation when it is placed onto the
# deck and make Scry Hand drags continue reliably outside the fixed tray.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
