name = "mtg-tabletop-cloudflarefinal"
main = "worker-h208.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H208 keeps H207 intact and removes the remaining shadow/filter effect from the
# dedicated Your Side pile boxes using a higher-specificity #you override.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
