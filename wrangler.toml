name = "mtg-tabletop-cloudflarefinal"
main = "worker-h175.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H175: preserve H174 bounded Full Board canvas. Add explicit red/blue board
# frames and position Full Board cards directly from each owner's exact board
# rect using the same stored x/y percentages as the dedicated board views.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
