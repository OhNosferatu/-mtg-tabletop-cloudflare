name = "mtg-tabletop-cloudflarefinal"
main = "worker-h118.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H118: keep H117's interactive Full Board, but drag a single fixed card clone
# on Safari to prevent visual trails and map Full Board drops through the exact
# normal-side battlefield geometry so positions match between views.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
