name = "mtg-tabletop-cloudflarefinal"
main = "worker-h121.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H121: preserve H120's exact one-to-one Full Board geometry and pile sizing,
# but mirror the opponent pile column vertically so it reads top-to-bottom as
# Tokens, Exile, Deck, Discard, Commander.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
