name = "mtg-tabletop-cloudflarefinal"
main = "worker-h71.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H71: keep the proven H64 build-time chain and scan the complete imported
# Archidekt deck for Scryfall-related tokens and emblems at import time.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
