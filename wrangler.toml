name = "mtg-tabletop-cloudflarefinal"
main = "worker-h52.js"
compatibility_date = "2026-08-31"

# H52: separate deck tapping from pointer capture so opening the deck cannot
# occur inside the same captured pointer event used for dragging the top card.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
