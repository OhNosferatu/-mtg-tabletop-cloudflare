name = "mtg-tabletop-cloudflarefinal"
main = "worker-h244.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H244 keeps H243's free battlefield placement and H242's card shape. The H124
# drag recognizer now commits the exact visual center of the drag ghost instead
# of re-centering the card under the finger on pointerup, removing the visible
# release-time jump while preserving existing hand/pile hit testing.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
