name = "mtg-tabletop-cloudflarefinal"
main = "worker-h88.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H88: hard-delete every local-player-owned card on Mulligan, rebuild a fresh
# copy from the last successful import data, shuffle the rebuilt library, and
# deal seven while leaving opponent-owned state untouched.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
