name = "mtg-tabletop-cloudflarefinal"
main = "worker-h239.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H239 keeps H238/H237/H236 behavior intact and changes only Full Board card
# corner rendering. Full Board cards are much smaller than dedicated-board cards,
# so their inherited 7px radius clipped too much of the artwork. H239 scales that
# radius down proportionally without changing card size, position, gestures, or
# Full Board scrolling.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
