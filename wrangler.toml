name = "mtg-tabletop-cloudflarefinal"
main = "worker-h240.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H240 builds from H238, removes H239's assumption that Full Board cards are
# smaller, and reasserts the intended one-to-one table model: opponent full-size
# board + 58px divider + player full-size board. Full Board cards use the exact
# normal battlefield card width measured by H116, and all battlefield views stop
# clipping the artwork corners with an extra rounded overflow mask.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
