name = "mtg-tabletop-cloudflarefinal"
main = "worker-h195.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H195: preserve H193/H178 three-screen behavior, stabilize active-tab switching,
# and remove H194's competing Full Board scroll-restoration layer so H178 alone
# controls returning to the last Full Board position without a visible snap.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
