name = "mtg-tabletop-cloudflarefinal"
main = "worker-h77.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H77: return to the stable H71 interaction baseline, keep complete/hydrated
# token import, and isolate Tokens-pile full-screen controls from normal cards.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
