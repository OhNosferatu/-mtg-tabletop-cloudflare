name = "mtg-tabletop-cloudflarefinal"
main = "worker-h212.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H212 keeps H211 as the stable board/transfer baseline and fixes face-down card
# revealing so one Flip tap loads missing front artwork and completes the reveal
# automatically. Card movement, piles, land zones, scrolling, and shadows remain unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
