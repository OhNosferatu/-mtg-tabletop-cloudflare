name = "mtg-tabletop-cloudflarefinal"
main = "worker-h151.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H151: preserve H150 pile order and all current gameplay/interaction behavior,
# but replace every game-facing and runtime instance of Discard/discard/DISCARD
# with Graveyard/graveyard/GRAVEYARD across HTML, JavaScript, and CSS assets.
# The graveyard is now the canonical zone name throughout the running game.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
