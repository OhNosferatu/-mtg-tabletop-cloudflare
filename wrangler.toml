name = "mtg-tabletop-cloudflarefinal"
main = "worker.js"
compatibility_date = "2026-08-31"

# H33 infrastructure recovery: static frontend assets are served directly by Cloudflare.
# Only API routes run through worker.js first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]
