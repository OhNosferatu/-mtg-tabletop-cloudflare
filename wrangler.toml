name = "mtg-tabletop-cloudflarefinal"
main = "worker-h117.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H117: turn the full-size continuous Full Board into an interactive tabletop.
# Both public battlefields and public piles can be manipulated from Full Board,
# while hand contents remain private and only each player's hand count is shown.
# Opponent deck/public-state actions expose hooks for the multiplayer sync layer.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
