name = "mtg-tabletop-cloudflarefinal"
main = "worker-h248.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H248 keeps H247's Full Board free-placement behavior and fixes the underlying
# state transfers for Full Board piles. Moving a real card from deck/commander/
# tokens/other piles to the battlefield now removes it from the source first;
# field-to-pile moves likewise detach the source id before adding it to the target.
# Opponent public deckCount is decremented when a known deck card leaves the deck.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
