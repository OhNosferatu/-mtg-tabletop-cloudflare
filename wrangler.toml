name = "mtg-tabletop-cloudflarefinal"
main = "worker-h76.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H76: preserve complete/hydrated token discovery and give token cards an
# isolated full-screen control overlay with no legacy inspector or pointer-hold
# machinery. Tokens use the same token-safe viewer from pile, Hand, or field.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
