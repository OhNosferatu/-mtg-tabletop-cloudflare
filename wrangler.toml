name = "mtg-tabletop-cloudflarefinal"
main = "worker-h112.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H112: keep H111 Full Board behavior, but remove the visible scrollbar and use
# direct touch scrolling across the Full Board itself. Since Full Board has no
# pile column, both land zones now share equal full-width margins and line up.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
