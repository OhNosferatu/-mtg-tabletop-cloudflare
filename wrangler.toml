name = "mtg-tabletop-cloudflarefinal"
main = "worker-h125.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H125: preserve H124 gesture controls and Full Board behavior while unifying
# battlefield counter presentation. Full-card inspection keeps +1/+1 and X/X
# controls/readouts separate; board views display their combined final P/T in
# one badge. Your Side, Opponent, and Full Board now use the same badge sizing
# and the larger Full Board font treatment.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
