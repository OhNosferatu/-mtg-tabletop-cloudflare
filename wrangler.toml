name = "mtg-tabletop-cloudflarefinal"
main = "worker-h191.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H191: keep H190 proportional board scaling, but move Full Board pile positions
# into durable CSS slots so H116 pile cloning after Mulligan cannot erase them.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
