name = "mtg-tabletop-cloudflarefinal"
main = "worker-h201.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H201 keeps H200 as the stable baseline, aligns the Full Board player pile slots
# to the dedicated Your Side pile geometry, and gives player pile labels the same
# gray typography on both screens. No opponent, card, scroll, board-size, or
# gesture behavior is changed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
