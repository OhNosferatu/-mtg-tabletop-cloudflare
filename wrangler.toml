name = "mtg-tabletop-cloudflarefinal"
main = "worker-h247.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H247 builds from H244 and fixes the actual H211 Full Board drop route. Existing
# battlefield cards now use H244's drag-ghost center instead of the raw pointer,
# and Full Board placement writes directly into the destination board plane with
# no card-to-card snap helper. Your Side/Opponent behavior remains unchanged.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
