name = "mtg-tabletop-cloudflarefinal"
main = "worker-h148.js"
compatibility_date = "2026-08-31"

routes = [
  { pattern = "mtgtabletop.app", custom_domain = true }
]

# H148: preserve H147 behavior while ensuring Full Board deck piles are visually
# blank whenever their deck count is zero. Both player and opponent Full Board
# deck zones now suppress the card-back art until cards are actually present.
# No gameplay, board geometry, dragging, snapping, turn, or gesture changes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
